plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zasaweryq.pary'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zasaweryq.pary'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // подпись отладочным ключом, чтобы релизный APK сразу ставился на телефон
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
